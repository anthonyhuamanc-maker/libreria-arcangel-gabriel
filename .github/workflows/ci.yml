name: Node.js CI

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Usar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
    
    - name: Instalar dependencias
      run: cd server && npm install
    
    - name: Ejecutar pruebas
      run: cd server && npm test